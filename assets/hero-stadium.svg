<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Estadio nocturno</title>
  <desc id="description">Ilustración abstracta de un estadio y una cancha iluminada.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07070a"/>
      <stop offset=".62" stop-color="#101018"/>
      <stop offset="1" stop-color="#08080b"/>
    </linearGradient>
    <radialGradient id="lightA" cx=".18" cy=".08" r=".52">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".58"/>
      <stop offset=".35" stop-color="#2563eb" stop-opacity=".16"/>
      <stop offset="1" stop-color="#0a0a0d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lightB" cx=".83" cy=".14" r=".55">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".46"/>
      <stop offset=".38" stop-color="#7c3aed" stop-opacity=".14"/>
      <stop offset="1" stop-color="#0a0a0d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pitch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#115e3a"/>
      <stop offset=".48" stop-color="#15803d"/>
      <stop offset="1" stop-color="#064e3b"/>
    </linearGradient>
    <pattern id="seats" width="28" height="22" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#fafafa" opacity=".12"/>
      <circle cx="18" cy="13" r="1.5" fill="#fafafa" opacity=".09"/>
    </pattern>
    <filter id="blur">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#lightA)"/>
  <rect width="1600" height="900" fill="url(#lightB)"/>
  <path d="M0 350Q800 170 1600 350V660Q800 510 0 660Z" fill="#15151c"/>
  <path d="M0 375Q800 220 1600 375V625Q800 500 0 625Z" fill="url(#seats)"/>
  <g fill="#fff" opacity=".76" filter="url(#blur)">
    <ellipse cx="215" cy="265" rx="150" ry="20"/>
    <ellipse cx="1385" cy="265" rx="150" ry="20"/>
  </g>
  <g fill="#f8fafc" opacity=".78">
    <circle cx="112" cy="264" r="5"/><circle cx="144" cy="260" r="5"/><circle cx="176" cy="257" r="5"/>
    <circle cx="208" cy="255" r="5"/><circle cx="240" cy="255" r="5"/><circle cx="272" cy="257" r="5"/><circle cx="304" cy="261" r="5"/>
    <circle cx="1296" cy="261" r="5"/><circle cx="1328" cy="257" r="5"/><circle cx="1360" cy="255" r="5"/>
    <circle cx="1392" cy="255" r="5"/><circle cx="1424" cy="257" r="5"/><circle cx="1456" cy="260" r="5"/><circle cx="1488" cy="264" r="5"/>
  </g>
