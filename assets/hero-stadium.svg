  <path d="M800 560v340M465 560l-220 340M1135 560l220 340M360 730h880" fill="none" stroke="#f8fafc" stroke-opacity=".58" stroke-width="5"/>
  <ellipse cx="800" cy="729" rx="112" ry="56" fill="none" stroke="#f8fafc" stroke-opacity=".58" stroke-width="5"/>
  <path d="M665 900v-74h270v74M716 560v72h168v-72" fill="none" stroke="#f8fafc" stroke-opacity=".58" stroke-width="5"/>
  <path d="M0 760Q800 600 1600 760V900H0Z" fill="#050507" opacity=".46"/>
